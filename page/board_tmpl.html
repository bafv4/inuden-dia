<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>犬電 発車標</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 発車標：駅と番線・盤面の様式（液晶／3色LED／フルカラーLED）・段数・言語を選ぶ → 盤面 → このあとの発車 → 番線の時刻表。
   盤面はいつも暗い地、まわりは他のページと同じ配色。段はどれも同じ高さ・同じ字の大きさ（本人の指定）。
   時刻などの数字（等幅）は JetBrains Mono（2026-11-12 本人が見本から選んだ。もとは Azeret Mono）。
   LEDは点（ドット）の並びとして描く：使う字はすべて、光らせる点を表（page/ledfont16.txt・ledfont24.txt）に決めてあり、
   盤面はその表の点だけで描く（フォントは使わない）。表は src/ledfont.py が作り、手で直せる。電車の絵も光らせる点を決めて描く */
:root{
  --bg:#F5F1E9; --panel:#FBF9F4; --ink:#35383B; --sub:#645044; --muted:#7B6A5E; --line:#DED2C4;
  --teal:#236962; --amber:#EAC05B; --sel:#35383B; --sel-fg:#F5F1E9;
  --k-loc:#5F6367; --k-exp:#246BA3; --k-rap:#BE493B; --k-dh:#9A8B7E;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2E3134; --panel:#35383B; --ink:#F5F1E9; --sub:#DED2C4; --muted:#B8A898; --line:#4C5054;
  --teal:#5BAEA3; --amber:#EAC05B; --sel:#F5F1E9; --sel-fg:#2E3134; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2E3134; --panel:#35383B; --ink:#F5F1E9; --sub:#DED2C4; --muted:#B8A898; --line:#4C5054;
  --teal:#5BAEA3; --amber:#EAC05B; --sel:#F5F1E9; --sel-fg:#2E3134; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--sub);font-weight:500}
.home{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;padding:5px 12px 5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font-size:13px;line-height:1.2;text-decoration:none}.home:hover,.home:focus-visible{border-color:var(--ink)}      /* 入口（index.html）へ戻る */
h1{font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:.08em;line-height:1.3}
h2{font-size:16px;margin:0;letter-spacing:.08em}
.lead{color:var(--sub);font-size:13.5px;margin:0;max-width:80ch}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-top:1.5px solid var(--ink);padding-top:9px}
.sec-h .meta{font-size:12.5px;color:var(--muted)}
button,select,input{font:inherit;color:inherit}
/* 操作 */
.ctrl{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.ctrl .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ctrl .cap{font-size:12px;color:var(--muted);letter-spacing:.08em;min-width:4.5em}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:15px;font-weight:700;min-width:9em}
select.sm{min-width:0;font-size:13px;font-weight:400;padding:4px 6px}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.plats .btn{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px}
.plats .no{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .3em;border-radius:.85em;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-size:12px}
.plats .btn[aria-pressed="true"] .no{background:var(--sel-fg);color:var(--sel)}
.plats .dir{font-size:12.5px}
#dirs .no{font-family:var(--f-ui);font-size:11px;font-weight:700;border-radius:.4em}      /* 方面のボタンの「上り・下り」 */
input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--f-num);font-size:14px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:0}

/* ===== 盤面（共通） ===== */
.board{container:board/inline-size;background:#0C0E11;color:#F4F2EC;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 6px #2A2D31,0 0 0 7px #43474C,0 14px 40px rgba(0,0,0,.25)}
.bd{font-size:clamp(13px,2.45cqw,32px);font-family:var(--f-ui)}
.bd-h{display:flex;align-items:center;gap:.7em;padding:.5em .8em;border-bottom:2px solid #262A30;background:#101318}
.bd-h .pno{display:inline-flex;align-items:baseline;justify-content:center;flex:none;line-height:2.1em;height:2.1em;min-width:2.1em;padding:0 .45em;border-radius:1.05em;
  background:#F4F2EC;color:#0C0E11;font-weight:700;font-size:1.1em;white-space:nowrap}
.bd-h .pno small{font-size:.5em;margin-left:.1em}
.bd-h .ttl{display:flex;flex-direction:column;line-height:1.22;min-width:0}
.bd-h .st{font-size:.72em;color:#9DA3A9;letter-spacing:.1em}
.bd-h .dir{font-size:1.02em;font-weight:700;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-h .alt{font-size:.6em;color:#9DA3A9;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-h .clk{margin-left:auto;font-family:var(--f-num);font-size:1.25em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bd-h .clk small{font-size:.62em;color:#9DA3A9}
.bd-h .clk .sim{display:block;font-family:var(--f-ui);font-size:.42em;color:#F2C94C;letter-spacing:.08em}
#bLed{display:none}

/* ===== 液晶（HTMLの文字で描く） ===== */
.cols,.row{display:grid;grid-template-columns:var(--gc);align-items:center;column-gap:.5em;padding:0 .8em}
.cols{color:#9DA3A9;padding-top:.45em;padding-bottom:.25em;line-height:1.15}
.cols>span{font-size:.56em;letter-spacing:.1em;white-space:nowrap;overflow:hidden}
.cols .r{text-align:right} .cols .m{text-align:center}
.c{display:flex;align-items:center;min-width:0;height:100%;overflow:hidden}
.c .fx{flex:none;white-space:nowrap;transform-origin:left center}
.c-tm,.c-cr{justify-content:flex-end} .c-tm .fx,.c-cr .fx{transform-origin:right center}
.c-kind,.c-pl{justify-content:center} .c-kind .fx,.c-pl .fx{transform-origin:center}
.row.empty>*{visibility:hidden}
.row.end{grid-template-columns:1fr}
.row.end .c{justify-content:center}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.tick{position:relative;overflow:hidden;white-space:nowrap}
.tick .tt{position:absolute;left:0;top:0;will-change:transform}
/* 段の字は LED（字が段の高さいっぱい）に近づけて大きめにする。--zk 種別・--zt 時刻・--zd 行先・--zc 両数 */
.cols,.row{--gc:2.6em 4.4em 5.6em minmax(0,1fr) 3.4em 7.4em;--zk:1.3em;--zt:1.7em;--zd:1.8em;--zc:1.6em;--jw:5.4em;--nd:2.05em}
.all .cols,.all .row{--gc:2.6em 4.4em 5.6em minmax(0,1fr) 2.6em 3.4em 7.4em}
.row{height:2.5em;border-top:1px solid #262A30;background:#14171B}
.c-ord .fx{font-size:.6em;color:#9DA3A9;letter-spacing:.1em}
.c-kind{height:2em;border-radius:.2em;background:var(--kc);color:#fff;font-weight:700;letter-spacing:.14em}
.c-kind .fx{font-size:var(--zk);padding-left:.14em}
.c-kind .fx.jst{flex:1 1 auto;display:flex;justify-content:space-between;padding:0 .35em;letter-spacing:0}
.k-快速{--kc:var(--k-rap)} .k-急行{--kc:var(--k-exp)} .k-各停{--kc:var(--k-loc)}
.k-回送{--kc:transparent;color:#9DA3A9;box-shadow:inset 0 0 0 1.5px #5A5F66}
.k-通過{--kc:transparent;color:#F2C94C;box-shadow:inset 0 0 0 1.5px #F2C94C}
.c-tm .fx{font-family:var(--f-num);font-size:var(--zt);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.c-tm small{font-family:var(--f-ui);font-size:.4em;color:#9DA3A9;margin-left:.15em}
.c-dst .fx{font-weight:700;font-size:var(--zd);letter-spacing:.1em}
.c-dst small{font-size:.4em;font-weight:400;color:#9DA3A9;letter-spacing:.04em;margin-left:.4em}
.c-dst.mute .fx{color:#9DA3A9}
.c-dst .sno{position:relative;flex:none;width:calc(var(--nd)*82/78);height:calc(var(--nd)*82/78);margin-right:calc(var(--zd)*.5)}      /* ひし形と行先の間は行先の字の0.5倍 */
.c-dst .sno svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.c-dst .sno .t{position:absolute;left:0;top:0;width:var(--nd);height:var(--nd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--nd)*.02);color:#35383B;font-weight:700;line-height:1;font-style:normal}
.c-dst .sno i{font-style:normal;font-size:calc(var(--nd)*.2);letter-spacing:.04em}
.c-dst .sno b{font-weight:700;font-size:calc(var(--nd)*.38)}
.c-dst .jst{display:inline-flex;justify-content:space-between;width:var(--jw);min-width:max-content;letter-spacing:0}
.c-dst .fx.jst{display:flex;width:auto;min-width:4em;flex:0 1 var(--jw)}      /* 駅ナンバリングの右の残りが足りなければ割り付けの幅を縮める。4字分より狭いときは全段そろって fit() で横に縮む */      /* 均等割り付けの幅（行先の字の大きさが単位） */
.c-pl .fx{display:inline-grid;place-items:center;min-width:1.45em;height:1.45em;border-radius:.73em;background:#F4F2EC;color:#0C0E11;font-family:var(--f-num);font-size:1.05em}
.c-cr .fx{font-family:var(--f-num);font-size:var(--zc);color:#F2C94C}
.c-cr small{font-family:var(--f-ui);font-size:.55em;margin-left:.1em}
.c-nt .fx{font-size:.8em;line-height:1.25;color:#9DA3A9;white-space:normal;flex:1 1 auto}
.row.end .fx{color:#9DA3A9;font-size:1.3em;letter-spacing:.2em}
.go{color:#7DD3A6} .now{color:#F2C94C} .app{color:#FF9F5A}
/* 最下段は各段（.row）と同じ高さ 2.5em。字は行先（1.2em）より大きい 1.4em */
.tick{height:2.5em;border-top:2px solid #262A30;background:#08090B;color:#F2C94C}
.tick .tt{font-size:1.4em;line-height:calc(2.5em/1.4);letter-spacing:.08em}
/* 接近・通過の表示（液晶の最下段）：LED と同じく「電車がまいります／通過します」を、ふつうの表示と
   地を塗って字を抜いた表示とで 0.8秒ずつ交互に点滅。日英交互なら1サイクル（1.6秒）ごとに言語を替える */
.pos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#F2C94C}      /* 列車の位置 */
.pos .fx{display:inline-flex;align-items:center;gap:.55em;font-size:1.3em;font-weight:700;white-space:nowrap}
.pos .pl{margin-right:.4em;color:#F4F2EC;font-weight:700}      /* 当駅の時刻と種別 */
.pos .ps{border:2px solid currentColor;border-radius:.3em;padding:0 .45em;line-height:1.45}
.pos .ps.now{animation:posinv 1s step-end infinite}
.pos .pa{display:inline-flex;color:#9DA3A9}.pos .pa svg{width:1.25em;height:.9em;display:block}
.pos .pa.now{color:#F2C94C;animation:posblk 1s step-end infinite}
@keyframes posinv{0%{background:#F2C94C;color:#08090B}50%{background:transparent;color:#F2C94C}}
@keyframes posblk{50%{opacity:0}}
.ap{position:absolute;inset:0;overflow:hidden;color:#FF9F5A;animation:apinv 1.6s step-end infinite}
.ap.pass{color:#FF6B5A;animation-name:apinvp}
.ap .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ap .fx{flex:none;white-space:nowrap;transform-origin:center;font-weight:700;letter-spacing:.12em;font-size:1.4em}
.ap.two .m0{animation:apl0 3.2s step-end infinite} .ap.two .m1{animation:apl1 3.2s step-end infinite}
@keyframes apinv{0%{background:transparent;color:#FF9F5A}50%{background:#FF9F5A;color:#08090B}}
@keyframes apinvp{0%{background:transparent;color:#FF6B5A}50%{background:#FF6B5A;color:#08090B}}
@keyframes apl0{0%{visibility:visible}50%{visibility:hidden}}
@keyframes apl1{0%{visibility:hidden}50%{visibility:visible}}
@media (prefers-reduced-motion:reduce){
  .tick .tt{position:static;display:block;overflow:hidden;text-overflow:ellipsis;transform:none!important}
  .blink{animation:none} .ap,.ap.two .m0,.pos .pa.now{animation:none} .pos .ps.now{animation:none;background:#F2C94C;color:#08090B} .ap.two .m1{display:none}
}

/* ===== LED（点の並びをキャンバスに描く）。見出しと枠は印刷した板の扱い ===== */
.led .bd-h{background:#16191D;border-bottom:0}
.led .cols{display:block;position:relative;height:2.3em;padding:0;background:#16191D;color:#AEB4BA}
.led .cols>span{position:absolute;bottom:.35em;line-height:1.15}
.led .cols>span small{display:block;font-size:.8em;letter-spacing:.02em;opacity:.85}
.led #bRows,.led #bTick{display:none}
.led #bLed{display:block;width:100%}
.led .scr{background:#050403;padding:.35em 0}
.sty-led3 .bd-h .clk,.sty-led3 .bd-h .clk small{color:#4BFF5E}

@container board (max-width:620px){
  .bd{font-size:clamp(13px,4.1cqw,24px)}
  .cols,.row{--gc:4.4em 5em minmax(0,1fr) 3em;--zk:1.15em;--zt:1.5em;--zd:1.6em;--zc:1.4em;--jw:4.2em;--nd:1.5em}
  .all .cols,.all .row{--gc:4.4em 5em minmax(0,1fr) 2.3em 3em}
  .c-ord,.cols .c-ord,.c-nt,.cols .c-nt{display:none}
}

/* このあとの発車・時刻表 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);letter-spacing:.08em;font-weight:500}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.lg{max-width:46ch;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
tr.pass td,tr.dh td{color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:2px;color:#fff;background:var(--c);line-height:1.6;letter-spacing:.06em}
.chip.o{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}
.tt-grid{display:grid;grid-template-columns:3em 1fr;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.tt-grid .h{font-family:var(--f-num);text-align:center;padding:6px 0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--line) 40%,transparent)}
.tt-grid .m{display:flex;flex-wrap:wrap;gap:2px 4px;padding:5px 8px;border-bottom:1px solid var(--line);align-items:center}
.tt-grid .cur{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.mn{border:0;background:transparent;padding:1px 3px;border-radius:3px;cursor:pointer;font-family:var(--f-num);font-size:14px;display:inline-flex;align-items:baseline;gap:1px;line-height:1.3}
.mn:hover{background:color-mix(in srgb,var(--line) 70%,transparent)}
.mn .t{font-family:var(--f-ui);font-size:10px;font-weight:700;padding:0 3px;border-radius:2px;color:#fff;background:var(--c);align-self:center;margin-right:1px}
.mn sup{font-size:9px;color:var(--muted)}
.mn .d{font-family:var(--f-ui);font-size:10px;color:var(--sub)}
.mn.past{opacity:.38}
.mn.next{outline:2px solid var(--amber);outline-offset:-1px}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
/* 列車の詳細 */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;max-width:min(560px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(20,22,24,.45)}
.dl-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dl-h h3{margin:0;font-size:17px;line-height:1.4}
.dl-h .sub{font-size:12.5px;color:var(--muted)}
.dl-h .x{margin-left:auto}
.dl-b{max-height:min(70vh,640px);overflow:auto}
.dl-b table{font-size:13px}
.dl-b tr{cursor:default}
.dl-b tr.ps td{color:var(--muted)}
.dl-b tr.here td{background:color-mix(in srgb,var(--amber) 25%,transparent);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="index.html"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i="home"></span></a>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <section class="ctrl" id="ctrl">
    <div class="line">
      <label class="cap" for="st" data-i="cStation"></label>
      <button class="btn" type="button" id="prev">◀</button>
      <select id="st"></select>
      <button class="btn" type="button" id="next">▶</button>
    </div>
    <div class="line">
      <span class="cap" data-i="cTrack"></span>
      <div class="seg plats" id="plats" role="group"></div>
    </div>
    <div class="line">
      <span class="cap" data-i="cDir"></span>
      <div class="seg plats" id="dirs" role="group"></div>
    </div>
    <div class="line">
      <span class="cap" data-i="cTime"></span>
      <button class="btn" type="button" id="live" aria-pressed="true" data-i="now"></button>
      <input type="time" id="tm" step="1">
      <button class="btn" type="button" data-step="-600" data-i="m10"></button>
      <button class="btn" type="button" data-step="-60" data-i="m1"></button>
      <button class="btn" type="button" data-step="60" data-i="p1"></button>
      <button class="btn" type="button" data-step="600" data-i="p10"></button>
      <button class="btn" type="button" id="play" aria-pressed="false"></button>
      <select id="spd" class="sm">
        <option value="1">×1</option><option value="10" selected>×10</option><option value="60">×60</option><option value="300">×300</option>
      </select>
    </div>
    <div class="line">
      <span class="cap" data-i="cStyle"></span>
      <div class="seg" role="group" id="stys">
        <button class="btn" type="button" data-sty="lcd" data-i="sLcd"></button>
        <button class="btn" type="button" data-sty="led3" data-i="sLed3"></button>
        <button class="btn" type="button" data-sty="ledfc" data-i="sLedfc"></button>
      </div>
      <span class="cap" data-i="cRows" style="min-width:0;margin-left:8px"></span>
      <select id="rows" class="sm">
        <option value="auto" data-i="auto"></option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
      </select>

      <label class="chk"><input type="checkbox" id="oPass"><span data-i="oPass"></span></label>
      <label class="chk"><input type="checkbox" id="oTerm"><span data-i="oTerm"></span></label>
      <label class="chk"><input type="checkbox" id="oDh" checked><span data-i="oDh"></span></label>
      <label class="chk"><input type="checkbox" id="oAppr" checked><span data-i="oAppr"></span></label>

  <section class="board" id="board">
    <div class="bd" id="bd">
      <div class="bd-h">
        <div class="pno" id="bPno"></div>
        <div class="ttl"><span class="st" id="bSt"></span><span class="dir" id="bDir"></span><span class="alt" id="bAlt"></span></div>
        <div class="clk" id="bClk"></div>

<dialog id="dl" aria-labelledby="dlT"><div class="dl-h"><div><h3 id="dlT"></h3><div class="sub" id="dlS"></div></div><button class="btn x" type="button" id="dlX">×</button></div><div class="dl-b"><table id="dlB"></table></div></dialog>

<script>
const D=__DATA__;
const ST=D.stations.map(s=>({name:s[0],line:s[1],en:s[2],plats:s[3].map(p=>({p:p[0],ja:p[1],en:p[2],arrOnly:!!p[3]})),no:s[4],dirs:s[5]}));
const BND=D.bounds;                       // 方面 [日本語, 英語]。S.pl が "d:番号" のときは方面で選んでいる
const SIX=Object.fromEntries(ST.map((s,i)=>[s.name,i]));
const TR=D.trains.map(a=>({no:a[0],kind:a[1],d:a[2],o:a[3],dir:a[4],co:a[5],cd:a[6],split:a[7],extra:a[8],stops:a[9]}));
TR.forEach(t=>{t.ks=t.split?t.stops.findIndex(s=>ST[s[0]].name===t.split):-1});
const KC={"快速":"var(--k-rap)","急行":"var(--k-exp)","各停":"var(--k-loc)","回送":"var(--k-dh)"};
const KN={"快速":["快速","Rapid Express","快速","R. Exp."],"急行":["急行","Express","急行"],"各停":["各停","Local","各駅停車"],"回送":["回送","Not in service","回送"]};
const DAY0=4*3600, ALT_MS=8000;                 // 0時〜4時は前日の続き。日英交互は8秒ごと
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const two=n=>String(n).padStart(2,'0');
const hm=s=>{s=Math.floor(s);return `${Math.floor(s/3600)%24}:${two(Math.floor(s%3600/60))}`};
const hms=s=>{s=Math.floor(s);return `${Math.floor(s/3600)%24}:${two(Math.floor(s%3600/60))}'${two(s%60)}`};
const SN=(n,l)=>l==="en"?(SIX[n]!=null?ST[SIX[n]].en:n):n;          // 駅名（言語）
const kn=(k,l)=>KN[k][l==="en"?1:0], kl=(k,l)=>KN[k][l==="en"?1:2];
const kb=(k,l)=>l==="en"?(KN[k][3]||KN[k][1]):KN[k][0];      // 盤面の種別の欄（英語は枠に入る略称があればそれ。案内の文・表は kn・kl の正式名）

// ---- 画面まわりの文言（盤面の言語が「交互」のときは日本語）
const I={home:["ホーム","Home"],eyebrow:["犬村電気鉄道 ・ 平日ダイヤ","Inumura Railway · Weekday timetable"],h1:["発車標","Departure board"],
 cStation:["駅","Station"],cTrack:["番線","Track"],cDir:["方面","Direction"],cTime:["時刻","Time"],cStyle:["盤面","Display"],cRows:["段数","Rows"],cLang:["言語","Language"],cShow:["表示","Show"],
 now:["現在時刻","Now"],m10:["−10分","−10 min"],m1:["−1分","−1 min"],p1:["＋1分","+1 min"],p10:["＋10分","+10 min"],
 sLcd:["液晶","LCD"],sLed3:["3色LED","3-color LED"],sLedfc:["フルカラーLED","Full-color LED"],auto:["自動","Auto"],lAlt:["日英交互","Alternate"],
 oPass:["通過する列車","Passing trains"],oTerm:["当駅止まり","Terminating here"],oDh:["回送","Not in service"],oAppr:["接近・通過の表示","Approach alerts"],
 hint:["「現在時刻」はこの端末の時計に合わせます。0時〜4時は前日の続き（終電まで）として扱います。番線の代わりに方面で選ぶと、その方面へ発車する列車を番線をまたいで出します。段数の「自動」は番線・方面ごとなら3段、全番線なら6段です。列車の行をクリックすると停車駅と時刻が出ます。",
       "\"Now\" follows this device's clock; 0:00–4:00 counts as the previous service day. Choosing a direction instead of a track shows trains leaving that way from any track. \"Auto\" rows: 3 for one track or direction, 6 for all tracks. Click a train for its stops and times."],
 nxH:["このあとの発車","Upcoming"],ttH:["時刻表","Timetable"]};
const CL=()=>S.lang==="en"?"en":"ja";
const tx=k=>I[k][CL()==="en"?1:0];
const L2=(ja,en,l)=>(l||CL())==="en"?en:ja;

// ---- 状態
const S={si:0,pl:"all",live:true,base:DAY0,t0:performance.now(),play:false,spd:10,pass:false,term:false,dh:true,appr:true,sty:"ledfc",rows:"auto",lang:"alt"};
function now(){
  if(S.live){const d=new Date();let s=d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000;if(s<DAY0)s+=86400;return s}
  return S.base+(S.play?(performance.now()-S.t0)/1000*S.spd:0);
}
function setTime(s){S.live=false;S.base=Math.max(DAY0,Math.min(DAY0+86400-1,s));S.t0=performance.now();syncCtrl();saveUrl()}
const BL=()=>S.lang==="alt"?(Math.floor(performance.now()/ALT_MS)%2?"en":"ja"):S.lang;      // 盤面の言語
const nRows=()=>S.rows==="auto"?(S.pl==="all"?6:3):+S.rows;
const isLed=()=>S.sty!=="lcd";

// ---- 駅ごとの発着（その駅の全列車。種類：dep 発車、pass 通過、arr 当駅止まり）
const EVC=new Map();
function eventsAt(si){
  if(EVC.has(si))return EVC.get(si);
  const ev=[];
  TR.forEach((t,ti)=>t.stops.forEach((s,k)=>{
    if(s[0]!==si)return;
    const last=k===t.stops.length-1;let type,time;
    if(k===0){type="dep";time=s[2]}else if(last){type="arr";time=s[1]}else if(s[3]){type="dep";time=s[2]}else{type="pass";time=s[1]}
    ev.push({ti,k,t,type,time,arr:k===0?null:s[1],plat:s[4],bnd:s[5]});
  }));
  ev.sort((a,b)=>a.time-b.time||a.ti-b.ti);EVC.set(si,ev);return ev;
}
const arrOnly=()=>{const p=ST[S.si].plats.find(x=>x.p===S.pl);return !!(p&&p.arrOnly)};
const dirOf=()=>S.pl.startsWith("d:")?+S.pl.slice(2):null;           // 方面で選んでいれば、その方面の番号
const multi=()=>S.pl==="all"||dirOf()!=null;                            // 番線をまたいで出す（番線の欄を出す）
const onPlat=e=>{const d=dirOf();return S.pl==="all"||(d!=null?e.bnd===d:e.plat===S.pl)};
const selName=l=>{const d=dirOf();return S.pl==="all"?L2("・全番線"," · all tracks",l):d!=null?L2("・"+BND[d][0]," · "+BND[d][1],l):L2("・"+S.pl+"番線"," · Track "+S.pl,l)};
const dirPlats=()=>[...new Set(eventsAt(S.si).filter(e=>e.type==="dep"&&e.t.kind!=="回送"&&onPlat(e)&&e.plat).map(e=>e.plat))].sort((a,b)=>a-b);
function shown(e){
  if(e.t.kind==="回送"&&!S.dh)return false;
  if(e.type==="pass"&&!S.pass)return false;
  if(e.type==="arr"&&!S.term&&!arrOnly())return false;      // 到着だけの番線は、当駅止まりをいつも出す
  return onPlat(e);
}
const until=e=>e.type==="arr"?e.time+30:e.time;
function upcoming(n,t){const out=[];for(const e of eventsAt(S.si)){if(until(e)<=t||!shown(e))continue;out.push(e);if(out.length>=n)break}return out}
const carsAt=(t,k)=>t.ks>=0&&k>=t.ks?t.cd:t.co;

// ---- 停車駅・分割の案内
function stopText(t,k,l){
  const rest=t.stops.slice(k+1),nm=s=>SN(ST[s[0]].name,l),en=l==="en";
  if(!rest.length)return "";
  if(rest.every(s=>s[3]))return rest.length>1?(en?`All stations to ${SN(t.d,l)}`:"終点まで各駅に停まります"):"";
  let a=0;while(a<rest.length&&rest[a][3])a++;
  let j=rest.length;while(j>0&&rest[j-1][3])j--;
  const tailAll=rest.length-j>=4;
  const head=a>=3?[en?`all stations to ${nm(rest[a-1])}`:`${nm(rest[a-1])}までの各駅`]:rest.slice(0,a).map(nm);
  const mid=rest.slice(a,tailAll?j:rest.length).filter(s=>s[3]).map(nm);
  const tail=tailAll?[en?`all stations from ${nm(rest[j])}`:`${nm(rest[j])}から先の各駅`]:[];
  return en?"Stops: "+[...head,...mid,...tail].join(", "):"停車駅　"+[...head,...mid,...tail].join("・");
}
// 流す文の重要な部分（種別・行先・両数・番線・分割・接続など）を印で囲む。フルカラーLEDだけ黄色で出し、ほかは印を外す（2026-11-13 本人の指定）
//   啓発文の強調は NH で別の印にし、3色LEDではそこだけ赤にする（2026-11-13 本人の指定）。フルカラーLEDでは HI と同じ黄色
//   種別は KB で別の印にし、フルカラーLEDでは種別の欄と同じく種別色の地に出す（2026-11-13 本人の指定）。中身は「種別\u0005表示名」
const HI=s=>"\u0001"+s+"\u0002", NH=s=>"\u0006"+s+"\u0007", KB=(k,l)=>"\u0003"+k+"\u0005"+kl(k,l)+"\u0004",
      plain=s=>String(s).replace(/\u0003[^\u0005]*\u0005/g,"").replace(/[\u0001-\u0004\u0006\u0007]/g,"");
function splitText(t,k,l){
  if(t.ks<0||k>=t.ks)return "";
  const en=l==="en",sp=SN(t.split,l),d=SN(t.d,l);
  if(t.cd<t.co)return HI(en?`Front ${t.cd} cars to ${d}; rear ${t.co-t.cd} cars terminate at ${sp}`:`前${t.cd}両は${d}まで、後ろ${t.co-t.cd}両は${sp}止まりです`);
  return HI(en?`${t.cd-t.co} cars added at ${sp}`:`${sp}で後ろに${t.cd-t.co}両を連結します`);
}
function infoText(e,l){
  const t=e.t,en=l==="en",d=SN(t.d,l);
  if(t.kind==="回送")return en?`This train is ${HI("not in service")}. ${HI("Please do not board.")}`:`この電車は${HI("回送電車")}です。${HI("ご乗車になれません。")}`;
  if(e.type==="pass")return en?`This train ${HI("does not stop here")}.`:`この電車は当駅を${HI("通過")}します。`;      // 通過・当駅止まりは種別・行先（発駅）を流さない（2026-11-12 本人の指定）
  if(e.type==="arr")return en?`This train ${HI("terminates here")}.`:`この電車は${HI("当駅止まり")}です。`;
  const parts=[en?`${e.k===0?HI("Starts here")+" · ":""}${KB(t.kind,l)} for ${HI(d)} · ${HI(carsAt(t,e.k)+" cars")}`:`${e.k===0?HI("当駅始発")+" ":""}${KB(t.kind,l)} ${HI(d)}ゆき　${HI(carsAt(t,e.k)+"両")}`];
  const st=stopText(t,e.k,l);if(st)parts.push(st);
  const sp=splitText(t,e.k,l);if(sp)parts.push(sp);
  for(const c of connections(e))parts.push(connText(c,l));
  return parts.join("　◆　");
}
// 流す文の終わりに足す啓発文。1回流すごとに次の文に替える（2026-11-13 本人の指定：禁煙・駆け込み乗車・危険物）
const NOTES=[
  [`駅構内・車内は${NH("全面禁煙")}です。ご協力をお願いします。`,`${NH("Smoking is prohibited")} in the station and on trains.`],
  [`${NH("駆け込み乗車")}は大変危険です。次の電車をご利用ください。`,`For your safety, ${NH("please do not rush")} onto the train. Please wait for the next one.`],
  [`${NH("危険物")}の駅構内・車内への${NH("持ち込みは禁止")}されています。`,`${NH("Dangerous articles")} are ${NH("not allowed")} in the station or on trains.`]];
const noteText=(i,l)=>NOTES[i%NOTES.length][l==="en"?1:0];
// ---- 接続列車：この列車が先の駅に着いてから10分以内にそこを出る営業列車で、同じ向きに進み、
//   この列車が行かない駅へ行くか（支線・終点の先）、この列車より先に着く駅があるもの。当駅でも乗れる列車は除く。
//   同じ列車に乗り換えられる駅がいくつかあれば、いちばん先の駅（この列車に長く乗っていられる駅）にする。1駅1本・駅の早い順に2本まで
const CONN_WIN=600, DEPS=new Map(), CONN=new Map();
const depsAt=si=>{if(!DEPS.has(si))DEPS.set(si,eventsAt(si).filter(e=>e.type==="dep"&&e.t.kind!=="回送"));return DEPS.get(si)};
function connections(e){
  const key=e.ti+"|"+e.k;if(CONN.has(key))return CONN.get(key);
  const t=e.t,here=t.stops[e.k][0],by=new Map();       // 乗り換える列車 → {j: この列車の何駅目, si, u}
  if(e.type==="dep"&&t.kind!=="回送")for(let j=e.k+1;j<t.stops.length;j++){
    const s=t.stops[j],ta=s[1];if(!s[3]||ta==null)continue;
    const later=new Map();for(let i=j+1;i<t.stops.length;i++)later.set(t.stops[i][0],t.stops[i]);      // この列車がこの先で通る駅
    for(const u of depsAt(s[0])){
      if(u.time<ta)continue;if(u.time>ta+CONN_WIN)break;
      const U=u.t;if(u.ti===e.ti||U.dir!==t.dir||U.stops.some(z=>z[0]===here&&z[3]))continue;
      const gain=U.stops.slice(u.k+1).some(z=>{if(!z[3])return false;const w=later.get(z[0]);return !w||(w[3]&&z[1]<w[1])});
      if(gain)by.set(u.ti,{j,si:s[0],u});
    }
  }
  const out=[];
  for(const c of [...by.values()].sort((a,b)=>a.j-b.j||a.u.time-b.u.time)){if(out.length>=2)break;if(!out.some(o=>o.si===c.si))out.push(c)}
  CONN.set(key,out);return out;
}
function connText(c,l){
  const U=c.u.t,x=SN(ST[c.si].name,l),d=SN(U.d,l);
  return l==="en"?`Connects at ${HI(x)} with the ${HI(hm(c.u.time)+" ")}${KB(U.kind,l)} for ${HI(d)}`:`${HI(x)}で ${HI(hm(c.u.time)+"発の")}${KB(U.kind,l)} ${HI(d)}ゆきに接続します`;
}
// ---- 接近・通過：選んでいる番線に、60秒以内に着く・通る列車（表示の切り替えに関係なく）
function approachEv(t){
  for(const e of eventsAt(S.si)){
    if(!onPlat(e))continue;
    const a=e.type==="dep"?e.arr:e.time;
    if(a==null)continue;
    if(a-t>60)break;
    if(a>t)return e;
  }
  return null;
}
function approachText(e,l){
  const en=l==="en",all=multi()&&e.plat,pass=e.type==="pass",dh=e.t.kind==="回送";
  const main=pass?(en?`Train passing through${all?` · Track ${e.plat}`:""}`:`${all?e.plat+"番線を ":""}電車が通過します`)
                 :(en?`${dh?"Out-of-service train":"Train"} approaching${all?` · Track ${e.plat}`:""}`:`${all?e.plat+"番線に ":""}${dh?"回送電車":"電車"}がまいります`);
  const sub=en?"Please stand behind the yellow tactile paving":"危ないですから黄色い点字ブロックまでお下がりください";
  return {pass,main,sub};
}

// ---- 列車の位置（最下段で、流す案内と交互に出す。日本語だけ。2026-11-13 本人の依頼）
//   選んでいる番線・方面に次に着く（通る）列車が、前々駅 ⇨ 前駅 ⇨ 当駅 のどこにいるか。駅は停車駅に限らず線路上の隣の駅。
//   ダイヤどおりの位置。前々駅より手前にいるとき・当駅始発のときは出さない。始発駅には発車の5分前からいることにする
const POS_DUR=9, POS_ORIG=300;      // 位置を出す秒数（2026-11-13 本人の指定で6秒から少し長く）
function posInfo(t){
  let best=null,ba=Infinity;
  for(const e of eventsAt(S.si)){
    if(e.time>t+7200)break;
    if(e.k===0||!shown(e))continue;
    const a=e.type==="dep"?e.arr:e.time;if(a==null||a<=t||a>=ba)continue;
    best=e;ba=a;
  }
  if(!best)return null;
  const st=best.t.stops,k=best.k,ta=j=>st[j][1]??st[j][2]-POS_ORIG,td=j=>st[j][2]??st[j][1];
  const items=[];for(const j of [k-2,k-1])if(j>=0)items.push({st:j,name:ST[st[j][0]].name},{ar:j});
  items.push({name:"当駅"});
  let lit=-1;
  items.forEach((it,i)=>{if(it.st!=null&&t>=ta(it.st)&&t<td(it.st))lit=i;if(it.ar!=null&&t>=td(it.ar)&&t<ta(it.ar+1))lit=i});
  if(lit<0)return null;
  const label=hm(best.time)+(best.type==="arr"?"着":best.type==="pass"?" 通過":" "+kn(best.t.kind,"ja"));      // どの列車かが分かるように、当駅の時刻と種別
  return {label,items:items.map(it=>it.name!=null?{name:it.name}:{arrow:1}),lit,key:best.ti+"|"+best.k+"|"+lit};
}

// ---- 段の中身（液晶・LEDで共通）
function rowData(e,t,l,led){
  const en=l==="en",tr=e.t,dh=tr.kind==="回送",pass=e.type==="pass";
  const r={kk:pass?"通過":tr.kind,kt:pass?(en?"Passing":"通過"):kb(tr.kind,l),tm:hm(e.time),suf:"",dst:SN(tr.d,l),sub:"",mute:false,
    plat:e.plat||"",cars:String(carsAt(tr,e.k)),unit:en?" cars":"両",nt:"",ntc:"",blink:false,sp:""};
  r.no=SIX[tr.d]!=null?ST[SIX[tr.d]].no:0;           // 行先の駅ナンバリング（液晶だけ出す）
  if(pass){r.mute=true;r.dst="";r.no=0;r.cars=""}            // 通過する列車は行先を出さない（2026-11-12 本人の指定）
  else if(e.type==="arr"){r.mute=true;r.kt="";r.dst=en?"Terminates here":"当駅止まり";      // 当駅止まりは種別を出さない（2026-11-12 本人の指定）
   r.suf=en?"arr":"着";if(t>=e.time){r.nt=en?"Arrived":"到着しました";r.ntc="now"}}
  if(e.type==="arr")r.no=0;
  if(dh){r.no=0;r.mute=true;r.dst=en?"Not in service":"回送";r.sub="";if(en)r.kt="";      // 英語は行先に Not in service と出すので、種別の欄は空ける
   if(!r.nt){r.nt=en?"No boarding":"ご乗車になれません"}}
  if(e.type==="dep"){
    const a=e.arr;
    if(a!=null&&t>=a){r.nt=en?"Boarding":"停車中";r.ntc="now"}          // 停車中は点滅させない。到着前（まもなく到着）は備考に出さない（本人の指定）

    //   （日英交互では日本語と英語が1本の文に続くので、「◆」と日英のつなぎ「　　　」で区切った文ごとに見る。2026-11-13 本人の指定）

// 盤面の大きさを決め、消灯した点の地を描いておく

  // 点は帯の中だけに描く。拡大率によって点の縁のぼかしが帯の外へ1画素はみ出し、そこは描き直さないので、

// 列車の位置の帯：駅名 ⇨ 駅名 ⇨ 当駅。いる駅は地を光らせて字を抜き、走っている区間は矢印を点滅させる（on で切り替え）

  const nat=items.map(it=>it.arrow?0:Math.ceil(ledSet(it.label??it.name,0,{}).tot));
  const fixed=items.reduce((a,it)=>a+(it.arrow?aw:it.label?0:2*pad),0)+g*(items.length-1)+g,sumN=nat.reduce((a,b)=>a+b,0);
  const k=Math.min(1,(W-fixed)/sumN),ws=items.map((it,i)=>it.arrow?aw:Math.floor(nat[i]*k)+(it.label?0:2*pad));

  if(ae){
    // 日英交互のときは、段の言語の切り替えとは別に、点滅の1サイクルごとに言語を替える（CSS の .two）
    const langs=S.lang==="alt"?["ja","en"]:[l];
    const key=`${ae.ti}|${ae.k}|${langs.join()}|${all}`;
    if(key!==lastAp){lastAp=key;lastTick="";if(anim){anim.cancel();anim=null}
      const ts=langs.map(x=>approachText(ae,x));
      $("bTick").innerHTML=`<div class="ap${ts[0].pass?" pass":""}${ts.length>1?" two":""}">${ts.map((a,i)=>`<div class="msg m${i}">${fx(esc(a.main))}</div>`).join("")}</div>`;
      fit($("bTick"));
    }
    return;
  }
  lastAp="";
  // 流し終えたら、列車の位置を出せるときは POS_DUR 秒出してから、また流す（LED と同じ）
  const tn=performance.now();
  //   流し終えるごとに、文の終わりの啓発文を次のものに替える（LED と同じ）
  if(tk!==lastTick){lastTick=tk;BOT.n=0;BOT.mode="tick";BOT.t0=tn;startTick(tk)}
  else if(BOT.mode==="tick"&&tn-BOT.t0>=BOT.dur*1000){BOT.n++;BOT.t0=tn;if(pos){BOT.mode="pos";BOT.pk=""}else startTick(tkOf(BOT.n))}
  else if(BOT.mode==="pos"&&(tn-BOT.t0>=POS_DUR*1000||!pos)){BOT.mode="tick";BOT.t0=tn;startTick(tkOf(BOT.n))}
  if(BOT.mode==="pos"&&pos.key!==BOT.pk){BOT.pk=pos.key;if(anim){anim.cancel();anim=null}
    const AR=`<svg viewBox="0 0 20 14" aria-hidden="true"><path d="M0 5h9V0l11 7-11 7V9H0z" fill="currentColor"/></svg>`;
    $("bTick").innerHTML=`<div class="pos" role="img" aria-label="${esc(pos.label+"の電車の位置 "+pos.items.map((it,i)=>(it.arrow?"→":it.name)+(i===pos.lit?"（ここ）":"")).join(" "))}"><span class="fx"><span class="pl">${esc(pos.label)}</span>${pos.items.map((it,i)=>it.arrow?`<span class="pa${i===pos.lit?" now":""}">${AR}</span>`:`<span class="ps${i===pos.lit?" now":""}">${esc(it.name)}</span>`).join("")}</span></div>`;
    fit($("bTick"));
  }
}
const BOT={mode:"tick",t0:0,dur:8,pk:"",n:0};
function startTick(txt){
  const box=$("bTick");
  if(anim){anim.cancel();anim=null}
  box.innerHTML=`<span class="tt"></span>`;const el=box.firstChild;el.textContent=plain(txt);
  BOT.dur=8;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cw=box.clientWidth,w=el.getBoundingClientRect().width,px=Math.max(90,cw/7);
  BOT.dur=1+(cw+w)/px;
  // LED と同じく、切り替わったら1秒あけてから文の頭を右端から流し始める（待つ間は右端の外に置く）
  anim=el.animate([{transform:`translateX(${cw}px)`},{transform:`translateX(${-w}px)`}],{duration:(cw+w)/px*1000,iterations:Infinity,delay:1000,fill:"backwards"});
}

// ---- 操作
function buildStations(){
  const sel=$("st"),en=CL()==="en";
  const og=(lbl,ln)=>`<optgroup label="${lbl}">`+ST.map((s,i)=>s.line===ln?`<option value="${i}">${esc(en?s.en:s.name)}</option>`:"").join("")+"</optgroup>";
  sel.innerHTML=og(en?"Main / Ogumo Line":"本線・奥雲線","M")+og(en?"Hasuki Line (Gakuin-mae is on the main line)":"蓮木線（学院前は本線に入っています）","H");
  sel.value=S.si;
}
function buildCtrl(){
  $("st").onchange=()=>{S.si=+$("st").value;S.pl="all";onStation()};
  $("prev").onclick=()=>{S.si=(S.si+ST.length-1)%ST.length;S.pl="all";onStation()};
  $("next").onclick=()=>{S.si=(S.si+1)%ST.length;S.pl="all";onStation()};
  $("live").onclick=()=>{S.live=true;S.play=false;syncCtrl();saveUrl();renderAll()};
  $("tm").onchange=()=>{const v=$("tm").value;if(!v)return;const [h,m,s]=v.split(":").map(Number);let x=h*3600+m*60+(s||0);if(x<DAY0)x+=86400;setTime(x);renderAll()};
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{setTime(now()+ +b.dataset.step);renderAll()});
  $("play").onclick=()=>{const t=now();S.live=false;S.play=!S.play;S.base=t;S.t0=performance.now();syncCtrl();saveUrl()};
  $("spd").onchange=()=>{const t=now();S.spd=+$("spd").value;S.base=t;S.t0=performance.now()};
  $("rows").onchange=()=>{S.rows=$("rows").value;saveUrl();renderAll()};
  document.querySelectorAll("[data-sty]").forEach(b=>b.onclick=()=>{S.sty=b.dataset.sty;syncCtrl();saveUrl();renderAll()});
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;applyChrome();saveUrl();renderAll()});
  [["oPass","pass"],["oTerm","term"],["oDh","dh"],["oAppr","appr"]].forEach(([id,k])=>$(id).onchange=()=>{S[k]=$(id).checked;saveUrl();renderAll()});
  $("dlX").onclick=()=>$("dl").close();
  $("dl").addEventListener("click",ev=>{if(ev.target===$("dl"))$("dl").close()});
}
function syncCtrl(){
  $("live").setAttribute("aria-pressed",S.live);
  $("play").setAttribute("aria-pressed",S.play&&!S.live);
  $("play").textContent=S.play&&!S.live?L2("❚❚ 止める","❚❚ Pause"):L2("▶ 進める","▶ Play");
  $("st").value=S.si;$("spd").value=S.spd;$("rows").value=S.rows;
  $("oPass").checked=S.pass;$("oTerm").checked=S.term;$("oDh").checked=S.dh;$("oAppr").checked=S.appr;
  document.querySelectorAll("[data-sty]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sty===S.sty));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
}
function applyChrome(){
  document.documentElement.lang=CL();
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=tx(el.dataset.i));
  $("prev").setAttribute("aria-label",L2("前の駅","Previous station"));$("next").setAttribute("aria-label",L2("次の駅","Next station"));
  $("tm").setAttribute("aria-label",L2("表示する時刻","Time to show"));$("spd").setAttribute("aria-label",L2("進める速さ","Speed"));
  $("rows").setAttribute("aria-label",L2("段数","Rows"));$("ctrl").setAttribute("aria-label",L2("表示する駅・番線・時刻","Station, track and time"));
  $("board").setAttribute("aria-label",L2("発車標","Departure board"));$("dlX").setAttribute("aria-label",L2("閉じる","Close"));
  $("lead").textContent=L2(`終日のダイヤ（${D.src}・営業列車${D.count}本・回送${D.deadhead}本）から、駅と番線を選んで発車標を出します。番線は配線図に番号がないため tracks.py で決めた仮の番号です。`,
    `Departure boards for any station and track, built from the all-day timetable (${D.src}: ${D.count} trains in service, ${D.deadhead} out of service). Track numbers are provisional (assigned by tracks.py).`);
  buildStations();buildPlats();syncCtrl();
}
function onStation(){syncCtrl();buildPlats();saveUrl();renderAll()}
function buildPlats(){
  const st=ST[S.si],en=CL()==="en";
  const b=(p,no,lbl)=>`<button class="btn" type="button" data-p="${p}" aria-pressed="${S.pl===p}"><span class="no">${no}</span><span class="dir">${esc(lbl)}</span></button>`;
  $("plats").innerHTML=b("all",en?"All":"全",en?"All tracks":"全番線")+st.plats.map(x=>b(x.p,x.p,en?x.en:x.ja)).join("");
  $("plats").setAttribute("aria-label",L2("番線","Track"));
  $("dirs").innerHTML=st.dirs.map(i=>{const up=BND[i][0].startsWith("上り");
    return b("d:"+i,en?(up?"Up":"Down"):(up?"上り":"下り"),en?BND[i][1]:BND[i][0].replace(/^[上下]り /,""))}).join("");
  $("dirs").setAttribute("aria-label",L2("方面","Direction"));
  for(const g of ["plats","dirs"])$(g).querySelectorAll("button").forEach(x=>x.onclick=()=>{S.pl=x.dataset.p;buildPlats();saveUrl();renderAll()});
}
function saveUrl(){
  const q=new URLSearchParams();q.set("st",ST[S.si].name);if(dirOf()!=null)q.set("dir",BND[dirOf()][0]);else if(S.pl!=="all")q.set("pl",S.pl);
  if(!S.live)q.set("t",hms(now()).replace("'",":"));
  if(S.pass)q.set("pass","1");if(S.term)q.set("term","1");if(!S.dh)q.set("dh","0");if(!S.appr)q.set("appr","0");
  if(S.sty!=="ledfc")q.set("sty",S.sty);if(S.rows!=="auto")q.set("rows",S.rows);if(S.lang!=="alt")q.set("lang",S.lang);
  history.replaceState(null,"","?"+q.toString());
}
function loadUrl(){
  const q=new URLSearchParams(location.search);
  const i=ST.findIndex(s=>s.name===q.get("st")||s.en===q.get("st"));S.si=i>=0?i:ST.findIndex(s=>s.name==="新犬村");
  const p=q.get("pl");S.pl=p&&ST[S.si].plats.some(x=>x.p===p)?p:"all";
  const di=BND.findIndex(b=>b[0]===q.get("dir")||b[1]===q.get("dir"));if(di>=0&&ST[S.si].dirs.includes(di))S.pl="d:"+di;
  const t=q.get("t");if(t&&/^\d{1,2}:\d{2}(:\d{2})?$/.test(t)){const [h,m,s]=t.split(":").map(Number);let x=h*3600+m*60+(s||0);if(x<DAY0)x+=86400;S.live=false;S.base=x}
  S.pass=q.get("pass")==="1";S.term=q.get("term")==="1";S.dh=q.get("dh")!=="0";S.appr=q.get("appr")!=="0";
  const sty=q.get("sty");S.sty=sty==="led"?"led3":["lcd","led3"].includes(sty)?sty:"ledfc";      // led は以前の3色LEDの指定。指定がなければフルカラーLED（2026-11-13 本人の指定）
  const r=q.get("rows");S.rows=r&&/^[2-8]$/.test(r)?r:"auto";
  const lg=q.get("lang");S.lang=["ja","en"].includes(lg)?lg:"alt";      // 指定がなければ日英交互（2026-11-13 本人の指定）
}

// ---- このあとの発車

  $("nx").querySelectorAll("tbody tr[data-ti]").forEach(r=>{const go=()=>openTrain(+r.dataset.ti,+r.dataset.k);r.onclick=go;r.onkeydown=ev=>{if(ev.key==="Enter")go()}});

// ---- 時刻表（発車だけ。回送・通過・当駅止まりは入れない）
function abbr(names){const m={};names.forEach(n=>{let k=1;while(names.some(o=>o!==n&&o.slice(0,k)===n.slice(0,k))&&k<n.length)k++;m[n]=n.slice(0,k)});return m}
function renderTT(t){
  const l=CL(),all=multi();
  const L=eventsAt(S.si).filter(e=>e.type==="dep"&&e.t.kind!=="回送"&&onPlat(e));
  if(!L.length){$("tt").innerHTML=`<div class="m" style="grid-column:1/-1">${L2("この番線から発車する営業列車はありません","No trains depart from this track")}</div>`;$("ttLeg").textContent="";$("ttMeta").textContent="";return}
  const cnt={};L.forEach(e=>cnt[e.t.d]=(cnt[e.t.d]||0)+1);
  const dests=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),main=dests[0],ab=abbr(dests.map(d=>SN(d,l)));
  const A=d=>ab[SN(d,l)];
  const nx=L.find(e=>e.time>=t),by={};
  L.forEach(e=>{const h=Math.floor(e.time/3600);(by[h]=by[h]||[]).push(e)});
  const ch=Math.floor(t/3600);
  $("tt").innerHTML=Object.keys(by).map(Number).sort((a,b)=>a-b).map(h=>`<div class="h ${h===ch?"cur":""}">${h%24}</div><div class="m ${h===ch?"cur":""}">${by[h].map(e=>{
    const tr=e.t,m=two(Math.floor(e.time%3600/60));
    const tag=tr.kind==="各停"?"":`<span class="t" style="--c:${KC[tr.kind]}">${kn(tr.kind,l)[0]}</span>`;
    return `<button type="button" class="mn ${e.time<t?"past":""} ${e===nx?"next":""}" data-ti="${e.ti}" data-k="${e.k}" title="${kn(tr.kind,l)} ${esc(SN(tr.d,l))} ${hms(e.time)}${e.plat?" "+L2(e.plat+"番線","Track "+e.plat):""}">${tag}${m}${all&&e.plat?`<sup>${e.plat}</sup>`:""}${tr.d!==main?`<span class="d">${esc(A(tr.d))}</span>`:""}</button>`}).join("")}</div>`).join("");
  $("tt").querySelectorAll(".mn").forEach(b=>b.onclick=()=>openTrain(+b.dataset.ti,+b.dataset.k));
  $("ttMeta").textContent=`${SN(ST[S.si].name,l)}${selName(l)}　${L2("発車 "+L.length+"本",L.length+" departures")}`;
  $("ttLeg").innerHTML=`<span>${esc(L2(`無印の行先は${main}行`,`Unmarked: for ${SN(main,l)}`))}</span>`+dests.slice(1).map(d=>`<span>${esc(A(d))}＝${esc(SN(d,l))}</span>`).join("")
    +`<span><span class="chip" style="--c:var(--k-rap)">${kn("快速",l)[0]}</span> ${kn("快速",l)}　<span class="chip" style="--c:var(--k-exp)">${kn("急行",l)[0]}</span> ${kn("急行",l)}　${L2("無印は各停","unmarked: Local")}</span>`+(all?`<span>${L2("右肩の数字は番線","small number: track")}</span>`:"");
}

// ---- 列車の詳細
function openTrain(ti,k){
  const t=TR[ti],l=CL();
  $("dlT").innerHTML=`<span class="chip ${t.kind==="回送"?"o":""}" style="--c:${KC[t.kind]}">${kn(t.kind,l)}</span> ${esc(L2(t.d+"行","for "+SN(t.d,l)))}　<span style="font-family:var(--f-num);font-size:14px;color:var(--muted)">${t.no}</span>`;
  $("dlS").textContent=`${SN(t.o,l)} ${hms(t.stops[0][2])}${L2("発","")} → ${SN(t.d,l)} ${hms(t.stops[t.stops.length-1][1])}${L2("着","")}　${t.co===t.cd?t.co:t.co+"→"+t.cd}${L2("両"," cars")}${t.split?L2(`（${t.split}で${t.cd<t.co?"分割":"併合"}）`,` (${t.cd<t.co?"splits":"joins"} at ${SN(t.split,l)})`):""}${t.extra?L2("　増発"," · extra"):""}`;
  const th=L2(["駅","着","発","番線"],["Station","Arr","Dep","Track"]);
  $("dlB").innerHTML=`<thead><tr>${th.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`+t.stops.map((s,j)=>{
    const ps=!s[3];
    return `<tr class="${ps?"ps":""} ${j===k?"here":""}"><td>${esc(SN(ST[s[0]].name,l))}</td><td class="n">${ps?"":s[1]!=null?hms(s[1]):""}</td><td class="n">${ps?L2("レ ","pass ")+hms(s[1]):s[2]!=null?hms(s[2]):""}</td><td class="n">${s[4]||"—"}</td></tr>`}).join("")+"</tbody>";
  $("dl").showModal();
  const here=$("dlB").querySelector("tr.here");if(here)here.scrollIntoView({block:"center"});
}

// ---- 毎回の描き直し
let lastMin=-1;
function renderAll(){lastMin=-1;lastTick="";lastRows="";lastAp="";LED.rowsKey="";tick()}
function tick(){
  const t=now();
  if(!S.live&&t>=DAY0+86400-1){S.play=false;S.base=DAY0+86400-1;syncCtrl()}
  renderBoard(t);
  const m=Math.floor(t/60);
  if(m!==lastMin){lastMin=m;renderNext(t);renderTT(t);if(document.activeElement!==$("tm"))$("tm").value=`${two(Math.floor(t/3600)%24)}:${two(Math.floor(t%3600/60))}:${two(Math.floor(t)%60)}`}
}
// ---- 字の表を作る：盤面に出る字をすべて洗い出し、2つの盤面（縦16点・24点）の大きさで点にして、src/ledfont.py の受け口へ送る
async function ledGenerate(port){
  const sets={n:new Set(),b:new Set()};
  const add=(s,big)=>{for(const c of plain(s||""))sets[big&&/[\d:]/.test(c)?"b":"n"].add(c)};
  for(let i=32;i<127;i++)sets.n.add(String.fromCharCode(i));
  for(const c of "0123456789:")sets.b.add(c);
  const pl0=S.pl;
  ST.forEach((st,si)=>{for(const e of eventsAt(si))for(const l of ["ja","en"]){
    const a=e.arr??e.time;
    for(const t of [e.time-600,e.time-30,a+1,e.time+10]){
      const r=rowData(e,t,l,true);
      add(r.kt);add(r.tm+(r.suf?(l==="en"?" ":"")+r.suf:""),!r.suf);add(r.dst);add(r.plat,true);add(r.cars+r.unit,true);add(r.nt);add(r.sp);
    }
    add(infoText(e,l));add(NOTES.map((_,i)=>noteText(i,l)).join(""));if(e.plat)add(l==="en"?`Track ${e.plat}　`:`${e.plat}番線　`);
    for(const pl of ["all",e.plat||"all"]){S.pl=pl;const ap=approachText(e,l);add(ap.main);add(ap.sub)}
  }});
  S.pl=pl0;
  ["本日の電車は終了しました","Service has ended for today","この番線から発車する電車はありません","No departures from this track",
   "本日の営業は終了しました。ご利用ありがとうございました。","Service has ended for today. Thank you for riding with us.","　　　","　◆　"].forEach(x=>add(x));
  Object.values(KN).forEach(k=>k.forEach(x=>add(x)));
  ST.forEach(st=>add(st.name));add("当駅");      // 列車の位置（最下段）には行先にならない駅名も出る
  const link=document.createElement("link");link.rel="stylesheet";
  link.href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&family=Roboto+Condensed:wght@400&display=swap";
  document.head.appendChild(link);await new Promise(r=>{link.onload=r;link.onerror=r});
  const all=[...sets.n,...sets.b].join(""),lines=[];
  for(const sty of ["led3","ledfc"]){
    const cfg=LEDCFG[sty],N=cfg.N;LED.cfg=cfg;ledReset();
    for(const gc of Object.values(cfg.gen))await document.fonts.load(ledFont(gc.f,N),all);
    for(const [v,set] of Object.entries(sets))for(const ch of set){
      const cls=v==="b"?"dig":/[ -~]/.test(ch)?"lat":"cjk",gc=cfg.gen[cls],m=ledMetric(gc,cls),g=ledGlyph(gc,m,ch,cls);
      let w=Math.max(1,Math.round(v==="b"&&/\d/.test(ch)?ledGlyph(gc,m,"0",cls).adv:g.adv));      // 大きい数字は同じ幅
      let lo=1e9,hi=-1;for(let j=0;j<N;j++)for(let x=0;x<g.gw;x++)if(g.mask[j*g.gw+x]){lo=Math.min(lo,x-g.ox);hi=Math.max(hi,x-g.ox)}
      let sh=0;                                                                             // はみ出す点は送り幅の中へ寄せる
      if(hi>=0){if(hi-lo+1>w)w=hi-lo+1;if(hi+sh>=w)sh=w-1-hi;if(lo+sh<0)sh=-lo}
      const rows=[];for(let j=0;j<N;j++){let r="";for(let x=0;x<w;x++){const sx=x-sh+g.ox;r+=sx>=0&&sx<g.gw&&g.mask[j*g.gw+sx]?"#":"."}rows.push(r)}
      lines.push([N,v,ch.codePointAt(0).toString(16).toUpperCase(),w,rows.join("/")].join(String.fromCharCode(9)));      // タブ区切り
    }
  }
  await fetch(`http://127.0.0.1:${port}/`,{method:"POST",body:lines.join(String.fromCharCode(10))});      // 1字1行
}
buildCtrl();loadUrl();applyChrome();renderAll();
if(LEDGEN)ledGenerate(LEDGEN);
setInterval(tick,250);
new ResizeObserver(()=>{LED.key="";lastTick="";lastRows="";lastAp=""}).observe($("board"));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{ledReset();lastTick="";lastRows="";lastAp=""});      // 字体が届いたら描き直す
</script>
