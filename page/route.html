<script>
// キャンバスの DCLogic の代わり（props と renderVals だけ使う）
class DCLogic{constructor(props){this.props=props||{}}}
class Component extends DCLogic {
  renderVals() {
    var main = [
      ['軒屋','Nokiya','EKT'],['土佐浜','Tosahama','EK'],['大手通','Otedori','EK'],
      ['裏町','Uramachi','EK'],['高砂町','Takasagocho','EK'],['千代町','Sendaicho','EK'],
      ['境橋','Sakaibashi','EKT'],['新犬村','Shin-Inumura','EKT'],['船場町','Sembacho',''],
      ['錦町','Nishikicho',''],['羅丹庵','Ranian',''],['学院前','Gakuin-mae','E'],
      ['瑞法院','Zuihoin',''],['本位堂','Hon-ido',''],['城見台','Shiromidai',''],
      ['就島','Shujima','EK'],['高島公園','Takashima-koen',''],['高島','Takashima','EKT'],
      ['西高島','Nishi-Takashima',''],['吹上台','Fukiagedai','E'],['朝日台','Asahidai','E'],
      ['岩瀬','Iwase',''],['秋田台','Akitadai','EK'],['院庄','In-nosho','E'],
      ['三宅','Miyake','E'],['戌居','Inui','E'],['狛野','Komano','EKT'],
      ['新狛野','Shin-Komano','EK'],['北川津','Kita-Kawatsu','E'],['星野','Hoshino','E'],
      ['犬塚','Inuzuka','EKT'],['長坂','Nagasaka','K'],['下岩田','Shimoiwata',''],
      ['羽土','Hado',''],['小椋','Ogura','K'],['東松田','Higashi-Matsuda','K'],
      ['東蔵寺','Tozoji',''],['奥雲口','Ogumoguchi','KT'],['霧里','Kirinosato','KT'],
      ['奥雲温泉','Ogumoonsen','KT']
    ];
    var hasu = [
      ['甲斐野','Kaino',''],['佐茂町','Samocho','E'],['北洋台','Hokuyodai','E'],['売布','Urufu',''],
      ['丑島','Ushijima',''],['桜湧水','Sakurayusui',''],['牧羊町','Bokuyocho','E'],['蓮木市','Hasukishi','E']
    ];
    var terminals = { '軒屋': 1, '奥雲温泉': 1, '犬塚': 1, '蓮木市': 1, '新犬村': 1, '高島': 1, '秋田台': 1, '新狛野': 1 };
    var ROW = { rap: 512, exp: 540, loc: 568, hExp: 808, hLoc: 836 };
    function mx(i) { return i <= 11 ? 2032 - 48 * i : 2032 - 48 * i - 48; }
    function hx(j) { return 1372 - 48 * j; }

    function col(x, top, h, s, ltd, no, lc) {
      var term = terminals[s[0]];
      var fs = term ? 24 : 22;
      var rs = term ? 14 : 13;
      return {
        name: s[0], roma: s[1], ltd: ltd, no: (no < 10 ? '0' : '') + no, lc: lc,
        romaStyle: 'writing-mode:vertical-rl;font-size:' + rs + 'px;font-weight:700;line-height:' + (rs + 2) + 'px;letter-spacing:0.04em;color:#35383B;white-space:nowrap',
        colStyle: 'position:absolute;left:' + (x - 23) + 'px;top:' + top + 'px;width:46px;height:' + h + 'px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end',
        nameStyle: 'writing-mode:vertical-rl;text-orientation:upright;font-size:' + fs + 'px;font-weight:700;line-height:' + fs + 'px;letter-spacing:0.04em;color:#35383B;white-space:nowrap'
      };
    }
    var cols = [];
    main.forEach(function (s, i) { cols.push(col(mx(i), 256, 232, s, s[2].indexOf('T') >= 0, i <= 27 ? i + 1 : 61 + i - 28, i <= 27 ? '#2B3A67' : '#8F6420')); });
    hasu.forEach(function (s, j) { cols.push(col(hx(j), 640, 144, s, false, 41 + j, '#236962')); });

    var marks = [];
    function stop(x, y) {
      marks.push({ style: 'position:absolute;left:' + (x - 5) + 'px;top:' + (y - 5) + 'px;width:10px;height:10px;border-radius:50%;background:#FFFFFF' });
    }
    main.forEach(function (s, i) {
      var x = mx(i);
      if (s[2].indexOf('K') >= 0) stop(x, ROW.rap);
      if (s[2].indexOf('E') >= 0) stop(x, ROW.exp);
      stop(x, ROW.loc);
    });
    hasu.forEach(function (s, j) {
      var x = hx(j);
      if (s[2].indexOf('E') >= 0) stop(x, ROW.hExp);
      stop(x, ROW.hLoc);
    });

    function label(x, w, y, text, sub, color, align) {
      return { text: text, sub: sub, style: 'position:absolute;left:' + x + 'px;top:' + (y - 12) + 'px;width:' + w + 'px;height:24px;white-space:nowrap;display:flex;align-items:center;gap:8px;justify-content:' + align + ';color:' + color };
    }
    var labels = [
      label(2080, 160, ROW.rap, '快速', 'Rapid Express', '#BE493B', 'flex-start'),
      label(2080, 160, ROW.exp, '急行', 'Express', '#246BA3', 'flex-start'),
      label(2080, 160, ROW.loc, '各停', 'Local', '#5F6367', 'flex-start'),
      label(884, 112, ROW.hExp, '急行', 'Express', '#246BA3', 'flex-end'),
      label(884, 112, ROW.hLoc, '各停', 'Local', '#5F6367', 'flex-end')
    ];
    return { cols: cols, marks: marks, labels: labels };
  }
}
(function(){
  const vals=new Component({}).renderVals();
  const get=(path,scope)=>path.trim().split('.').reduce((o,k)=>o==null?undefined:o[k],scope);
  const fill=(str,scope)=>str.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=get(p,scope);return v==null?'':String(v)});
  // <sc-for list="{{xs}}" as="x"> は中身を xs の数だけ繰り返す。ほかの要素は写して、属性と字の {{穴}} を埋める
  function expand(node,scope){
    if(node.nodeType===3)return [document.createTextNode(fill(node.nodeValue,scope))];
    if(node.nodeType!==1)return [];
    if(node.localName==='sc-for'){
      const list=get(node.getAttribute('list').replace(/^\s*\{\{|\}\}\s*$/g,''),scope)||[],as=node.getAttribute('as'),out=[];
      for(const item of list){const sc=Object.create(scope);sc[as]=item;node.childNodes.forEach(c=>out.push(...expand(c,sc)))}
      return out;
    }
    const el=node.cloneNode(false);
    for(const a of [...el.attributes])if(a.value.includes('{{'))el.setAttribute(a.name,fill(a.value,scope));
    node.childNodes.forEach(c=>expand(c,scope).forEach(n=>el.appendChild(n)));
    return [el];
  }
  const stage=document.getElementById('stage');
  document.getElementById('dc').content.childNodes.forEach(c=>expand(c,vals).forEach(n=>stage.appendChild(n)));
  // 幅に合わせて縮める（大きくはしない）
  const fit=document.getElementById('fit');
  const size=()=>{const k=Math.min(1,fit.clientWidth/2248);stage.style.transform=`scale(${k})`;fit.style.height=900*k+'px'};
  addEventListener('resize',size);size();
})();
</script>
